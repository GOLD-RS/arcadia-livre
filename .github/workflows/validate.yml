name: Validate Arcadia Livre
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required pages and assets
        run: |
          set -eu
          for f in index.html game.js styles.css sitemap.xml README.md click-rush.html virada-rapida.html pixel-snake.html conta-relampago.html stack-neon.html astro-dodge.html neon-breaker.html bubble-pop.html pixel-mole.html sky-runner.html color-circuit.html; do test -f "$f"; done
      - name: Parse JavaScript
        run: node --check game.js
      - name: Check sitemap routes
        run: |
          for f in click-rush virada-rapida pixel-snake conta-relampago stack-neon astro-dodge neon-breaker bubble-pop pixel-mole sky-runner color-circuit; do grep -q "$f.html" sitemap.xml; done
      - name: Validate game contracts
        run: node validate-games.js
