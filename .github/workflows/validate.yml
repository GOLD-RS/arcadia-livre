name: Validate Arcadia Livre
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical structure and assets
        run: |
          set -eu
          test ! -e validate-games.js
          test ! -d jogos
          for f in index.html game.js styles.css sitemap.xml manifest.webmanifest robots.txt README.md click-rush.html virada-rapida.html pixel-snake.html conta-relampago.html stack-neon.html astro-dodge.html neon-breaker.html bubble-pop.html pixel-mole.html sky-runner.html color-circuit.html; do test -f "$f"; done
      - name: Parse canonical JavaScript
        run: |
          set -eu
          node --check game.js
          for f in games-breaker.js games-dodge.js games-math.js games-snake.js games-stack.js js/games-*.js js/core/*.js; do node --check "$f"; done
      - name: Check published routes
        run: |
          set -eu
          for f in click-rush virada-rapida pixel-snake conta-relampago stack-neon astro-dodge neon-breaker bubble-pop pixel-mole sky-runner color-circuit; do grep -q "$f.html" sitemap.xml; done
      - name: Validate game contracts (canonical)
        run: node tests/validate-games.js
